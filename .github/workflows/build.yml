name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux / CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-latest
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.4.0", "13.3.0"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Install system dependencies
        run: |
          # CUDA is preinstalled in the image; these dependencies only need Ubuntu sources.
          # Ignore extra repositories so NVIDIA index sync failures do not block this step.
          test -s /etc/apt/sources.list
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list
            -o Dir::Etc::sourceparts=-
          )
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            build-essential git ca-certificates python3-dev python3-venv zlib1g-dev

      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install --upgrade pip "cmake>=3.24" ninja
          echo "$RUNNER_TEMP/build-env/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DHPDLP_BUILD_STATIC_LIB=ON \
            -DHPDLP_BUILD_SHARED_LIB=ON \
            -DHPDLP_BUILD_CLI=ON \
            -DHPDLP_BUILD_PYTHON=OFF \
            -DHPDLP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run CPU tests
        run: ctest --test-dir build -L cpu --output-on-failure

      - name: Install Python package
        run: |
          python -m pip install ".[test]" \
            --config-settings=cmake.define.CMAKE_CUDA_ARCHITECTURES=80

      - name: Run Python tests
        run: python -m pytest -m "not gpu"
