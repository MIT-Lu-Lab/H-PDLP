name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / CUDA ${{ matrix.cuda }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        cuda: ["12.4.0", "12.5.0", "12.6.0", "12.8.0", "12.9.0", "13.0.0", "13.1.0"]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: ${{ matrix.cuda }}
          linux-local-args: '["--toolkit"]'
          use-github-cache: 'false'
          log-file-suffix: '${{ matrix.os }}-${{ matrix.cuda }}'

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip "cmake>=3.24" ninja

      - name: Configure
        # Check every toolkit's build; run the test suites once per OS.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DHPDLP_BUILD_STATIC_LIB=ON \
            -DHPDLP_BUILD_SHARED_LIB=ON \
            -DHPDLP_BUILD_CLI=ON \
            -DHPDLP_BUILD_PYTHON=OFF \
            -DHPDLP_BUILD_TESTS=${{ matrix.cuda == '13.1.0' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build

      - name: Add PSLP to the Windows DLL search path
        if: runner.os == 'Windows' && matrix.cuda == '13.1.0'
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\build\_deps\pslp-build" >> $env:GITHUB_PATH

      - name: Run CPU tests
        if: matrix.cuda == '13.1.0'
        env:
          LD_LIBRARY_PATH: ${{ env.CUDA_PATH }}/lib64
        run: ctest --test-dir build -L cpu --output-on-failure

      - name: Install Python package
        if: matrix.cuda == '13.1.0'
        run: |
          python -m pip install ".[test]" \
            --config-settings=cmake.define.CMAKE_CUDA_ARCHITECTURES=80

      - name: Run Python tests
        if: matrix.cuda == '13.1.0'
        env:
          LD_LIBRARY_PATH: ${{ env.CUDA_PATH }}/lib64
        run: python -m pytest -m "not gpu"
