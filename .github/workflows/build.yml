name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux / CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-latest
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.4.0", "13.3.0"]
    defaults:
      run:
        shell: bash

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates python3-dev python3-venv zlib1g-dev

      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install \
            "cmake>=3.24" ninja "pybind11>=2.12.0"
          echo "$RUNNER_TEMP/build-env/bin" >> "$GITHUB_PATH"

      - name: Compile Python sources
        run: python -m compileall -q python/hopdlp

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DHOPDLP_BUILD_STATIC_LIB=ON \
            -DHOPDLP_BUILD_SHARED_LIB=ON \
            -DHOPDLP_BUILD_CLI=ON \
            -DHOPDLP_BUILD_PYTHON=ON \
            -DHOPDLP_BUILD_TESTS=OFF \
            -DPython_EXECUTABLE="$(command -v python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build --parallel 2
